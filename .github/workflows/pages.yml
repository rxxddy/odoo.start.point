name: Build and publish the site

on:
  push:
    branches: [main]
    paths:
      - "[0-9][0-9]-*/**"
      - "README.md"
      - "SUMMARY.md"
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.5.50"
      - name: Build the site
        run: python .github/pages/build.py . "$RUNNER_TEMP/site"
      - name: Publish to the gh-pages branch
        working-directory: ${{ runner.temp }}/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
