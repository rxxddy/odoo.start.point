<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Odoo Developer Handbook</title>
  <desc id="d">Animated banner: from Python and SQL to production Odoo modules</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d2e"><animate attributeName="stop-color" values="#1a1d2e;#25183d;#12283a;#1a1d2e" dur="14s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2a1b3f"><animate attributeName="stop-color" values="#2a1b3f;#16304a;#31183a;#2a1b3f" dur="14s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b86bff"/>
      <stop offset="0.5" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#b86bff" stop-opacity="0.35"><animate attributeName="stop-opacity" values="0.35;0.18;0.35" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#b86bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c1"><rect x="64" y="236" width="0" height="34"><animate attributeName="width" values="0;0;560;560;0;0" keyTimes="0;0.02;0.14;0.30;0.32;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="64" y="236" width="0" height="34"><animate attributeName="width" values="0;0;0;690;690;0;0" keyTimes="0;0.34;0.36;0.5;0.63;0.65;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="64" y="236" width="0" height="34"><animate attributeName="width" values="0;0;0;610;610;0;0" keyTimes="0;0.67;0.69;0.82;0.96;0.98;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#glow)"/>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" fill="#c9b8ff" opacity="0.5">
    <text x="880" y="300">self.env<animate attributeName="y" values="320;40" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" repeatCount="indefinite"/></text>
    <text x="1050" y="300">_inherit<animate attributeName="y" values="320;40" dur="13s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="2s" repeatCount="indefinite"/></text>
    <text x="1130" y="300">@api.depends<animate attributeName="y" values="320;40" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="4s" repeatCount="indefinite"/></text>
    <text x="780" y="300">SELECT ...<animate attributeName="y" values="320;40" dur="14s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="14s" begin="1s" repeatCount="indefinite"/></text>
    <text x="975" y="300">xpath<animate attributeName="y" values="320;40" dur="10s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="6s" repeatCount="indefinite"/></text>
    <text x="690" y="300">ir.rule<animate attributeName="y" values="320;40" dur="15s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="15s" begin="5s" repeatCount="indefinite"/></text>
  </g>

  <text x="64" y="112" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff">Odoo Developer Handbook</text>
  <rect x="64" y="130" width="0" height="5" rx="2.5" fill="url(#accent)"><animate attributeName="width" values="0;420;420" keyTimes="0;0.25;1" dur="1.6s" fill="freeze"/></rect>
  <text x="64" y="176" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24" fill="#d8d3ee">From Python and SQL to production Odoo modules.</text>
  <text x="64" y="208" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#9d97bd">Odoo 16 to 20  |  checked against the real source  |  works offline</text>

  <rect x="48" y="226" width="760" height="54" rx="10" fill="#0e1020" opacity="0.65"/>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21">
    <text x="64" y="261" fill="#7ee0a8" clip-path="url(#c1)">$ ./odoo-bin shell -d library --no-http</text>
    <text x="64" y="261" fill="#ffd166" clip-path="url(#c2)">&gt;&gt;&gt; env["library.loan"].search([("state", "=", "open")])</text>
    <text x="64" y="261" fill="#9fd3ff" clip-path="url(#c3)">&gt;&gt;&gt; loans.filtered("is_overdue").mapped("book_id.name")</text>
  </g>
</svg>
